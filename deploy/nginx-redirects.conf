# Mateus Games — 301 map (acceptance criterion #27: one canonical per page).
#
# Three families of duplicate URLs came out of the old OpenCart site:
#   1. http:// and https:// both answered              → force https
#   2. mateusgames.com.br and www.mateusgames.com.br   → force www (the canonical host)
#   3. index.php?_route_=… (and ?route=…)              → friendly URL
#
# Everything else is served by the SPA: unknown paths fall back to /index.html,
# which the prerender step has already filled with the real markup for each route.

# ---------------------------------------------------------------- 1 + 2: scheme and host
server {
    listen 80;
    listen [::]:80;
    server_name mateusgames.com.br www.mateusgames.com.br;
    return 301 https://www.mateusgames.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mateusgames.com.br;
    return 301 https://www.mateusgames.com.br$request_uri;
}

# ---------------------------------------------------------------- 3: legacy OpenCart routes
#
# The old store addressed everything through index.php. Examples, left → right:
#
#   /index.php?_route_=playstation                       → /playstation
#   /index.php?_route_=playstation/consoles              → /playstation/consoles
#   /index.php?_route_=usados                            → /produtos?condicao=usado
#   /index.php?_route_=playstation-5-slim-1tb-usado      → /produto/playstation-5-slim-1tb-usado
#   /index.php?_route_=product/product&product_id=42     → /produtos   (no slug to map to)
#   /index.php?route=common/home                         → /
#
# Product ids are not recoverable as slugs, so those land on the catalog instead of a
# guessed product: a 301 to the wrong product is worse for SEO than one to the listing.
#
# `map` reads the _route_ query argument; $legacy_target is empty when nothing matches.

map $arg__route_ $legacy_target {
    default                         "";
    ""                              "";
    "common/home"                   "/";
    "~^playstation(/|$)"            "/playstation";
    "~^(ps[1-5]|playstation)$"      "/playstation";
    "~^xbox(/|$)"                   "/xbox";
    "~^(nintendo|switch|wii|3ds)(/|$)" "/nintendo";
    "~^(retro|classicos)(/|$)"      "/retro";
    "~^usados?(/|$)"                "/produtos?condicao=usado";
    "~^gift-?cards?(/|$)"           "/gift-cards";
    "~^(assistencia|assistencia-tecnica|conserto)(/|$)" "/assistencia-tecnica";
    "~^(troca|troque-seu-game)(/|$)" "/troque-seu-game";
    "~^(sobre|quem-somos)(/|$)"     "/sobre";
    "~^(contato|fale-conosco)(/|$)" "/contato";
    "~^product/product"             "/produtos";
    "~^(?<slug>[a-z0-9]+(-[a-z0-9]+){2,})$" "/produto/$slug";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mateusgames.com.br;
    root /var/www/mateusgames/dist;

    # index.php no longer exists: send every legacy URL to its friendly equivalent.
    location = /index.php {
        if ($legacy_target != "") {
            return 301 $legacy_target;
        }
        return 301 /;
    }

    # Old sitemap/feed endpoints the crawler still asks for.
    location = /index.php/sitemap.xml { return 301 /sitemap.xml; }

    # Hashed assets are immutable; HTML is prerendered per route and revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Prerendered route → its own index.html; anything else falls back to the SPA shell.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}

